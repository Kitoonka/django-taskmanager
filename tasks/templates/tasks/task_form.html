<!DOCTYPE html>
<html>
<head>
    <title>{% if task %}Edit Task{% else %}Create Task{% endif %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">{% if task %}Edit Task{% else %}Create Task{% endif %}</h2>

    <form method="post" class="mb-3">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="title"
                   value="{% if task %}{{ task.title }}{% endif %}"
                   class="form-control"
                   placeholder="Task title" required>
        </div>

        <div class="mb-3">
            <label>Due Date:</label>
            <input type="date" name="due_date"
                   value="{% if task and task.due_date %}{{ task.due_date }}{% endif %}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Priority:</label>
            <select name="priority" class="form-select">
                <option value="High" {% if task and task.priority == "High" %}selected{% endif %}>High</option>
                <option value="Medium" {% if task and task.priority == "Medium" %}selected{% endif %}>Medium</option>
                <option value="Low" {% if task and task.priority == "Low" %}selected{% endif %}>Low</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            {% if task %}Update{% else %}Add{% endif %}
        </button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Back to Task List</a>
    </form>
</div>

</body>
</html>
